name: Sanitize doc table paths

on:
  push:
    paths:
      - '.github/workflows/sanitize-doc-table.yml'

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace local paths with relative paths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('doc_table.json')
          with path.open('r', encoding='utf-8') as f:
              data = json.load(f)

          for item in data.values():
              item['path'] = f"data/{item['filename']}"

          with path.open('w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=4)
              f.write('\n')
          PY

      - name: Commit sanitized result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc_table.json
          if git diff --cached --quiet; then
            echo "No path changes needed"
          else
            git commit -m "Normalize document paths in index output"
            git push
          fi
